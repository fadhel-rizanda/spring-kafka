services:
  temporal-ui:
    image: temporalio/ui:latest
    container_name: shop-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  temporal:
    image: temporalio/auto-setup:latest
    container_name: shop-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=shop-postgres
      - POSTGRES_USER=shop
      - POSTGRES_PWD=shop
      - POSTGRES_DB=shop
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:latest
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: